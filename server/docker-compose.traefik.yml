# QR proxy in Docker behind Traefik, with the browser's Origin stripped on the /api/qr hop.
#
# Deploy from the repository root, where the .env holding QR_API_KEY lives:
#   QR_HOST=app.example.com docker compose --env-file .env -f server/docker-compose.traefik.yml up -d --build
#
# Or set QR_HOST in .env and drop it from the command:
#   docker compose --env-file .env -f server/docker-compose.traefik.yml up -d --build
#
# How this differs from server/docker-compose.yml (the plain, no-Traefik variant):
#   * no published port — Traefik reaches the container over the shared Docker network, so the
#     proxy is never exposed on the host at all;
#   * a router for `<QR_HOST>/api/qr` carrying the qr-strip-origin middleware. Without that
#     middleware the proxy answers 403 to every browser POST: a browser sends Origin even on a
#     same-origin request, and QR_ALLOWED_ORIGINS is an exact-match list. See server/README.md,
#     "The Origin header on the hop".
#
# The shared network must already exist — `docker network create traefik`, or point
# TRAEFIK_NETWORK at the network your Traefik instance already uses.
services:
  qr-proxy:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: qr-proxy:latest
    environment:
      QR_API_KEY: ${QR_API_KEY:?QR_API_KEY must be set — put it in the root .env and pass --env-file .env}
      QR_API_URL: ${QR_API_URL:-https://artqrcode.oxog.net}
      # Not consulted while the middleware below strips Origin. Kept as defence in depth so
      # detaching that middleware cannot silently open the proxy to every other site.
      QR_ALLOWED_ORIGINS: ${QR_ALLOWED_ORIGINS:-http://localhost:5173}
      PORT: "8787"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      # Same-origin route on the app's own hostname: the browser POSTs to its own origin, so
      # VITE_QR_PROXY_URL stays unset and no CORS handshake is involved. Host + Path is more
      # specific than the app's catch-all rule and the priority is pinned, so this router wins.
      - "traefik.http.routers.qr-api.rule=Host(`${QR_HOST:?QR_HOST must be set — the public hostname the app is served on}`) && Path(`/api/qr`)"
      - "traefik.http.routers.qr-api.priority=100"
      - "traefik.http.routers.qr-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.qr-api.tls=true"
      - "traefik.http.routers.qr-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.routers.qr-api.service=qr-proxy"
      - "traefik.http.routers.qr-api.middlewares=qr-strip-origin"
      - "traefik.http.services.qr-proxy.loadbalancer.server.port=8787"
      # In Traefik's customRequestHeaders an EMPTY value REMOVES the header, which is what makes
      # the proxy's allowlist irrelevant for browser traffic.
      - "traefik.http.middlewares.qr-strip-origin.headers.customrequestheaders.Origin="
    restart: unless-stopped

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
