# QR proxy as a container. Run from anywhere with:
#   docker compose --env-file ../.env -f server/docker-compose.yml up -d --build
#
# The ${QR_API_KEY:?} form fails fast with a readable message instead of starting
# a proxy that rejects every request — a missing key is a configuration mistake,
# not a runtime state worth tolerating.
services:
  qr-proxy:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: qr-proxy:latest
    environment:
      QR_API_KEY: ${QR_API_KEY:?QR_API_KEY must be set — put it in the root .env and pass --env-file ../.env}
      QR_API_URL: ${QR_API_URL:-https://artqrcode.oxog.net}
      QR_ALLOWED_ORIGINS: ${QR_ALLOWED_ORIGINS:-http://localhost:5173}
      PORT: "8787"
    # Loopback only: the reverse proxy fronts this, and the provider key is the
    # only thing behind it.
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
