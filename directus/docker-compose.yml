services:
  directus:
    image: directus/directus:latest
    container_name: qr-vcard-directus
    ports:
      - "8055:8055"
    volumes:
      - directus_database:/directus/database
      - directus_uploads:/directus/uploads
    env_file:
      - .env
    healthcheck:
      # The Directus image ships no curl — the old probe logged
      # "/bin/sh: curl: not found" every 10s and the container sat at "unhealthy"
      # for 1200+ probes while the service itself was fine. It is a node image, so
      # probe with fetch instead (see also server/Dockerfile and root Dockerfile).
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:'+(process.env.PORT||8055)+'/server/ping')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  directus_database:
  directus_uploads:
