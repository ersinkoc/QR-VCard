# Nixpacks build plan — builds the same single-port production image as the root
# Dockerfile, without a checked-in Dockerfile (Railway and Coolify run Nixpacks
# from this file; locally: `nixpacks build . --name qr-vcard`).
#
# The start command runs server/serve.mjs: the built SPA from dist/, the app API
# (/api/*), the QR proxy (POST /api/qr) and GET /healthz, all on one port.
#
# Runtime variables the deployment needs (nothing is needed at build time):
#   DIRECTUS_URL     the Directus base URL, reached server-to-server
#   DIRECTUS_TOKEN   the service account token (npm run directus:bootstrap prints
#                    it into .env — copy it to the platform's variables)
#   SESSION_SECRET   cookie signing key, e.g. `openssl rand -hex 32`
#   QR_API_KEY       QR provider key
#   TRUST_PROXY=1    the platform's edge proxy appends X-Forwarded-For
#   PORT             injected by most platforms (default 8080)

[variables]
NODE_VERSION = "24"
NPM_CONFIG_AUDIT = "false"
NPM_CONFIG_FUND = "false"
NPM_CONFIG_UPDATE_NOTIFIER = "false"

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  # Bake the commit this image was built from; /healthz reports it as `sha`,
  # which the post-deploy smoke workflow compares against the pushed commit so
  # a run never validates a STALE deployment. Railway injects
  # RAILWAY_GIT_COMMIT_SHA, Coolify GIT_COMMIT_SHA — take whichever exists.
  "echo \"${RAILWAY_GIT_COMMIT_SHA:-${GIT_COMMIT_SHA:-${COMMIT_SHA:-}}}\" > .commit-sha",
  "npm run build",
]

[start]
cmd = "node server/serve.mjs"
