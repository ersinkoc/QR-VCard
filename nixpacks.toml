# Nixpacks build plan — builds the same single-port production app as the root
# Dockerfile (Coolify and Railway run Nixpacks from this file; locally:
# `nixpacks build . --name qr-vcard`).
#
# The start command validates the environment, waits for Directus, provisions or
# repairs the schema, then runs server/serve.mjs: the built SPA from dist/, the
# app API (/api/*), the QR endpoint (/api/qr/<code>) and GET /healthz, all on one
# port. Nothing is needed at build time — every setting is a runtime variable;
# see .env.example and docs/deploy.md.

[variables]
NPM_CONFIG_AUDIT = "false"
NPM_CONFIG_FUND = "false"
NPM_CONFIG_UPDATE_NOTIFIER = "false"
# Nixpacks detects Vite and would add a Caddy static server; this app serves
# itself (the API and the SPA share one origin), so skip it.
NIXPACKS_SPA_CADDY = "false"

[phases.setup]
# Pinned instead of derived from package.json "engines": a range such as
# "^22.12.0 || ^24" resolves differently across Nixpacks releases, and an old
# release silently falls back to Node 18, which cannot run Vite 8. nodejs_24
# ships its own npm.
nixPkgs = ["nodejs_24"]
nixpkgsArchive = "23f9169c4ccce521379e602cc82ed873a1f1b52b"

[phases.install]
# Dev dependencies are build tools (TypeScript, Vite); install them even when the
# platform sets NODE_ENV=production for the build.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  # Bake the commit this image was built from; /healthz reports it as `sha`,
  # which the post-deploy smoke workflow compares against the pushed commit.
  # Coolify injects SOURCE_COMMIT, Railway RAILWAY_GIT_COMMIT_SHA.
  "echo \"${SOURCE_COMMIT:-${RAILWAY_GIT_COMMIT_SHA:-${GIT_COMMIT_SHA:-${COMMIT_SHA:-}}}}\" > .commit-sha",
  "npm run build",
  "npm run deploy:check",
]

[start]
cmd = "node scripts/start-production.mjs"
