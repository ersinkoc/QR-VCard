# CI gate — the exact command sequence a deploy needs, on every push.
#
# Nothing environment-specific is baked into the bundle any more (Directus is
# configured at runtime on the server), so the build needs no variables; the
# deploy:check gate still fails any bundle that leaks a secret name or a
# Directus URL.
name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run scripts:check
      - run: npm run build
      - run: npm run deploy:check

  # The production image must build and must contain every module the server
  # imports (a module missing from the image only shows up at deploy time).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t qr-vcard .
      - name: Server modules load inside the image
        run: docker run --rm qr-vcard node -e "Promise.all(['./server/api.mjs','./server/qr-handler.mjs','./server/logger.mjs','./scripts/preflight.mjs'].map((m)=>import(m))).then(()=>console.log('modules ok'))"
      - name: Startup refuses the template configuration with a clear error
        run: |
          set +e
          out=$(docker run --rm --env-file .env.example qr-vcard 2>&1); code=$?
          echo "$out"
          test $code -eq 1 && echo "$out" | grep -q "DIRECTUS_TOKEN still holds the template value"
